name: CI

# Runs on every pull request: lint, unit tests, a production build and the
# comparison with Icarus Verilog.
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # our simulator against Icarus Verilog, change by change (docs/ICARUS.md)
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: npm run test:icarus
