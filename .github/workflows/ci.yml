name: CI

# Runs on every pull request: lint, unit tests, a production build, the
# comparison with Icarus Verilog, and browser tests on Chromium, Firefox and
# WebKit (Safari's engine).
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # our simulator against Icarus Verilog, change by change (docs/ICARUS.md)
      # the Ubuntu mirrors sometimes fail to resolve for a minute: retry before failing the check
      - name: Install Icarus Verilog
        run: |
          for i in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y iverilog && exit 0
            echo "attempt $i failed, retrying in 20 s"; sleep 20
          done
          exit 1
      - run: npm run test:icarus
      # browser tests on three engines, plus an iPhone layout and the frame rate (e2e/)
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
